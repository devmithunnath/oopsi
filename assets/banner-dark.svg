<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1116"/>
      <stop offset="55%" stop-color="#141821"/>
      <stop offset="100%" stop-color="#1D1518"/>
    </linearGradient>
    <radialGradient id="glow-coral" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 155) rotate(15) scale(340 220)">
      <stop stop-color="#FF6B4A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-mint" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(990 165) rotate(-12) scale(320 210)">
      <stop stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg-dark)"/>
