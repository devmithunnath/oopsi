  <g opacity="0.18" fill="#8B949E">
    <circle cx="88" cy="64" r="2"/><circle cx="128" cy="64" r="2"/><circle cx="168" cy="64" r="2"/>
    <circle cx="88" cy="104" r="2"/><circle cx="128" cy="104" r="2"/>
