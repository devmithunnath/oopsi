  <!-- Brand title + tagline -->
  <text x="308" y="156" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">oopsi</text>

  <rect x="525" y="106" width="136" height="32" rx="16" fill="#34D399" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.45"/>
  <text x="593" y="127" text-anchor="middle" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">$0/mo · MIT</text>

  <text x="310" y="198" fill="#C9D1D9" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="500">When users hit an oopsie, Oopsi catches it.</text>
  <text x="310" y="232" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Cloudflare Workers · D1 · R2 · React · Swift 6 (macOS / iOS) · OpenAPI 3.1</text>

